<extend template="base.shtml">
<head id="head">
	<link type="text/css" rel="stylesheet" href="$site.asset('notebook.css').link()">
</head>
<main id="main">
	<header class="notebook-header">
		<a class="lesson-back" href="$page.parentSection().link()" aria-label="Înapoi" title="Înapoi">
			<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13 8H3m4-4L3 8l4 4"></path></svg>
		</a>
		<div class="lesson-meta">
			<ctx :if="$page.custom.get?('level')"><span><small>Nivel</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('duration')"><span><small>Durată</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('python')"><span><small>Python</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('gpu')"><span><small>GPU</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('runtime')"><span><small>Runtime</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('memory')"><span><small>Memory</small><strong :text="$if"></strong></span></ctx>
			<ctx :if="$page.custom.get?('cpu')"><span><small>CPU</small><strong :text="$if"></strong></span></ctx>
		</div>
		<p class="notebook-actions">
			<a class="button" href="$page.asset('notebook.ipynb').link()" download>
				Descarcă notebook-ul
				<span class="download-icon" aria-hidden="true">
					<svg viewBox="0 0 16 16" focusable="false"><path d="M8 2v8m0 0 3-3m-3 3L5 7M3 13.5h10"></path></svg>
				</span>
			</a>
		</p>
	</header>
	<article class="notebook-content" :html="$page.content()"></article>
</main>
