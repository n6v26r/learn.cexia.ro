<extend template="base.shtml">
<head id="head">
	<style>
		.site-footer,
		.breadcrumbs,
		.page-heading,
		.page-tags {
			display: none;
		}

		main#main {
			display: grid;
			place-content: center;
			min-height: 85vh;
			gap: 0.75rem;
			padding: 0;
			text-align: center;
		}

		main#main > h1.title,
		main#main > div > p {
			margin: 0;
		}

		main#main > h1.title {
			font-size: 9rem;
			color: var(--navy);
		}
	</style>
</head>
<main id="main">
	<h1 class="title" :text="$page.title"></h1>
	<div :html="$page.content()"></div>
</main>
